<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reminder Bot</title>
<style>
  :root {
    --bg-1: #14101f;
    --bg-2: #1c1730;
    --bg-glow: #3d2a6b;
    --card: rgba(28, 24, 46, 0.65);
    --card-solid: #201a35;
    --border: rgba(255,255,255,0.08);
    --text: #f0ecfb;
    --text-dim: #9b93b8;
    --accent: #4fd1c5;
    --accent-dim: rgba(79, 209, 197, 0.15);
    --deadline: #ffb454;
    --deadline-dim: rgba(255, 180, 84, 0.15);
    --danger: #ff6b6b;
    --success: #4fd68c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: var(--text);
    min-height: 100vh;
    background:
      radial-gradient(circle at 15% 0%, var(--bg-glow) 0%, transparent 45%),
      radial-gradient(circle at 90% 15%, #2a4d5e 0%, transparent 40%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
    background-attachment: fixed;
    padding-bottom: 2.5rem;
  }
  header {
    padding: 1.75rem 1rem 1.25rem;
    text-align: center;
  }
  header .eyes {
    font-size: 1.6rem;
    letter-spacing: 0.3rem;
    margin-bottom: 0.4rem;
    opacity: 0.9;
  }
  header h1 {
    font-size: 1.4rem;
    margin: 0;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  header p {
    margin: 0.3rem 0 0;
    color: var(--text-dim);
    font-size: 0.85rem;
  }
  .tabs {
    display: flex;
    max-width: 480px;
    margin: 1.1rem auto 0;
    padding: 0 1rem;
    gap: 0.4rem;
  }
  .tab-btn {
    flex: 1;
    padding: 0.65rem 0.4rem;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 12px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .tab-btn.active {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--text);
  }
  main {
    max-width: 480px;
    margin: 0 auto;
    padding: 1rem;
  }
  .panel { display: none; }
  .panel.active { display: block; animation: fadeIn 0.25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px);} to { opacity: 1; transform: translateY(0);} }

  .card {
    background: var(--card);
    backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.1rem;
    margin-bottom: 1rem;
  }
  .card h2 {
    font-size: 0.78rem;
    margin: 0 0 0.85rem;
    color: var(--text-dim);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  label {
    display: block;
    font-size: 0.78rem;
    color: var(--text-dim);
    margin: 0.7rem 0 0.35rem;
  }
  input[type="text"], input[type="time"], input[type="number"] {
    width: 100%;
    padding: 0.7rem 0.8rem;
    background: rgba(0,0,0,0.25);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 1rem;
  }
  input:focus, .type-btn:focus-visible, .tab-btn:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  /* Calendar picker */
  .date-field {
    padding: 0.7rem 0.8rem;
    background: rgba(0,0,0,0.25);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 1rem;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .date-field .dim { color: var(--text-dim); }
  .cal-wrap { position: relative; }
  .calendar {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    background: var(--card-solid);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 0.8rem;
    z-index: 20;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .calendar.open { display: block; }
  .cal-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.6rem;
    font-size: 0.9rem;
    font-weight: 600;
  }
  .cal-nav {
    background: none;
    border: none;
    color: var(--text);
    font-size: 1.1rem;
    cursor: pointer;
    padding: 0.2rem 0.5rem;
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
    text-align: center;
  }
  .cal-grid .dow {
    font-size: 0.68rem;
    color: var(--text-dim);
    padding-bottom: 0.3rem;
  }
  .cal-day {
    padding: 0.45rem 0;
    border-radius: 8px;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .cal-day:hover { background: rgba(255,255,255,0.08); }
  .cal-day.today { color: var(--accent); font-weight: 700; }
  .cal-day.selected { background: var(--accent); color: #0d1b1a; font-weight: 700; }
  .cal-day.other-month { color: rgba(255,255,255,0.2); }

  .type-toggle { display: flex; gap: 0.5rem; margin-top: 0.3rem; }
  .type-btn {
    flex: 1;
    padding: 0.55rem;
    background: rgba(0,0,0,0.25);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text-dim);
    font-size: 0.85rem;
    cursor: pointer;
    text-align: center;
  }
  .type-btn.selected[data-type="reminder"] { border-color: var(--accent); background: var(--accent-dim); color: var(--text); }
  .type-btn.selected[data-type="deadline"] { border-color: var(--deadline); background: var(--deadline-dim); color: var(--text); }

  button.primary {
    width: 100%;
    margin-top: 1.1rem;
    padding: 0.8rem;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    color: #0d1b1a;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
  }
  button.primary:active { transform: scale(0.99); }

  .bucket-label {
    font-size: 0.75rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin: 1.3rem 0 0.5rem;
    font-weight: 700;
  }
  .item {
    background: var(--card);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 0.8rem 0.9rem;
    margin-bottom: 0.5rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  .item.deadline { border-left: 3px solid var(--deadline); }
  .item.reminder { border-left: 3px solid var(--accent); }
  .item-text { flex: 1; font-size: 0.93rem; }
  .item-badge {
    font-size: 0.7rem;
    padding: 0.22rem 0.55rem;
    border-radius: 20px;
    white-space: nowrap;
    font-weight: 700;
  }
  .item-badge.urgent { background: var(--deadline-dim); color: var(--deadline); }
  .item-badge.ok { background: var(--accent-dim); color: var(--accent); }
  .del-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 1.05rem;
    cursor: pointer;
    padding: 0.2rem 0.35rem;
  }
  .empty { color: var(--text-dim); font-size: 0.85rem; text-align: center; padding: 1.3rem 0; }
  .status { text-align: center; font-size: 0.75rem; margin-top: 0.5rem; min-height: 1em; }

  /* Routine checklist */
  .routine-row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.6rem 0.2rem;
    border-bottom: 1px solid var(--border);
  }
  .routine-row:last-child { border-bottom: none; }
  .routine-check {
    width: 22px; height: 22px;
    border-radius: 7px;
    border: 2px solid var(--text-dim);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    font-size: 0.85rem;
  }
  .routine-check.done { background: var(--success); border-color: var(--success); color: #0d1b1a; }
  .routine-text { flex: 1; font-size: 0.92rem; }
  .routine-text.done { text-decoration: line-through; color: var(--text-dim); }
  .routine-add-row { display: flex; gap: 0.5rem; margin-top: 0.8rem; }
  .routine-add-row input { flex: 1; }
  .routine-add-row button {
    background: var(--accent-dim);
    border: 1px solid var(--accent);
    color: var(--text);
    border-radius: 10px;
    padding: 0 0.9rem;
    cursor: pointer;
    font-weight: 700;
  }

  /* Timer */
  .timer-display {
    font-size: 2.6rem;
    font-weight: 800;
    text-align: center;
    letter-spacing: 0.03em;
    margin: 0.5rem 0 1rem;
    font-variant-numeric: tabular-nums;
  }
  .timer-inputs { display: flex; gap: 0.5rem; }
  .timer-btns { display: flex; gap: 0.5rem; margin-top: 0.9rem; }
  .timer-btns button {
    flex: 1;
    padding: 0.65rem;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.04);
    color: var(--text);
    font-weight: 700;
    cursor: pointer;
  }
  .timer-btns button.start { background: var(--accent-dim); border-color: var(--accent); }
  .timer-btns button.stop { background: rgba(255,107,107,0.15); border-color: var(--danger); }

  .alarm-row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.55rem 0.2rem;
    border-bottom: 1px solid var(--border);
  }
  .alarm-row:last-child { border-bottom: none; }
  .alarm-time { font-size: 1.1rem; font-weight: 700; flex: 1; }
  .add-alarm-row { display: flex; gap: 0.5rem; margin-top: 0.9rem; }
  .add-alarm-row input { flex: 1; }
  .add-alarm-row button {
    background: var(--accent-dim); border: 1px solid var(--accent);
    color: var(--text); border-radius: 10px; padding: 0 0.9rem; cursor: pointer; font-weight: 700;
  }
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    align-items: center; justify-content: center;
    z-index: 100;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--card-solid);
    border: 1px solid var(--accent);
    border-radius: 16px;
    padding: 1.5rem;
    text-align: center;
    max-width: 320px;
  }
  .modal-box h3 { margin: 0.3rem 0; }
  .modal-box button {
    margin-top: 1rem;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    padding: 0.6rem 1.5rem;
    color: #0d1b1a;
    font-weight: 700;
    cursor: pointer;
  }
</style>
</head>
<body>

<header>
  <div class="eyes">◕ ◕</div>
  <h1>Reminder Bot</h1>
  <p>Add a note. The bot reads it back when you ask.</p>
</header>

<div class="tabs">
  <button class="tab-btn active" data-tab="add">Add</button>
  <button class="tab-btn" data-tab="notes">Notes</button>
  <button class="tab-btn" data-tab="control">Control</button>
</div>

<main>

  <!-- ADD TAB -->
  <div class="panel active" id="panel-add">
    <div class="card">
      <h2>Add a note</h2>
      <label for="text-input">What is it?</label>
      <input type="text" id="text-input" placeholder="e.g. Submit DBMS assignment">

      <label>Due date</label>
      <div class="cal-wrap">
        <div class="date-field" id="date-field">
          <span id="date-field-label">Select a date</span>
          <span class="dim">📅</span>
        </div>
        <div class="calendar" id="calendar">
          <div class="cal-head">
            <button class="cal-nav" id="cal-prev">‹</button>
            <span id="cal-month-label"></span>
            <button class="cal-nav" id="cal-next">›</button>
          </div>
          <div class="cal-grid" id="cal-grid"></div>
        </div>
      </div>

      <label>Type</label>
      <div class="type-toggle">
        <div class="type-btn selected" data-type="reminder">Reminder</div>
        <div class="type-btn" data-type="deadline">Deadline</div>
      </div>

      <button class="primary" id="add-btn">Add note</button>
      <div class="status" id="add-status"></div>
    </div>
  </div>

  <!-- NOTES TAB -->
  <div class="panel" id="panel-notes">

    <div class="card">
      <h2>Daily routine</h2>
      <div id="routine-list"></div>
      <div class="routine-add-row">
        <input type="text" id="routine-input" placeholder="e.g. Drink water">
        <button id="routine-add-btn">+</button>
      </div>
    </div>

    <div id="deadlines-section"></div>
    <div id="buckets-section"></div>
  </div>

  <!-- CONTROL TAB -->
  <div class="panel" id="panel-control">
    <div class="card">
      <h2>Timer</h2>
      <div class="timer-display" id="timer-display">05:00</div>
      <div class="timer-inputs">
        <div style="flex:1">
          <label style="margin-top:0">Minutes</label>
          <input type="number" id="timer-minutes" value="5" min="0" max="180">
        </div>
        <div style="flex:1">
          <label style="margin-top:0">Seconds</label>
          <input type="number" id="timer-seconds" value="0" min="0" max="59">
        </div>
      </div>
      <div class="timer-btns">
        <button class="start" id="timer-start">Start</button>
        <button id="timer-pause">Pause</button>
        <button class="stop" id="timer-reset">Reset</button>
      </div>
    </div>

    <div class="card">
      <h2>Alarms</h2>
      <div id="alarm-list"></div>
      <div class="add-alarm-row">
        <input type="time" id="alarm-time-input">
        <button id="alarm-add-btn">+</button>
      </div>
      <p style="color:var(--text-dim); font-size:0.75rem; margin-top:0.8rem; margin-bottom:0;">
        Only rings while this page stays open in your browser.
      </p>
    </div>

    <div class="card">
      <h2>Drive</h2>
      <p class="empty" style="padding:0.5rem 0;">Motor controls arrive in a later phase.</p>
    </div>
  </div>

</main>

<div class="modal-overlay" id="alert-modal">
  <div class="modal-box">
    <h3 id="alert-title">⏰ Time's up</h3>
    <p id="alert-message" style="color:var(--text-dim)"></p>
    <button id="alert-dismiss">Dismiss</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
  // ---------- Tabs ----------
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("panel-" + btn.dataset.tab).classList.add("active");
    });
  });

  // ---------- Type toggle ----------
  let selectedType = "reminder";
  document.querySelectorAll(".type-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".type-btn").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
      selectedType = btn.dataset.type;
    });
  });

  // ---------- Calendar picker ----------
  const dateField = document.getElementById("date-field");
  const dateFieldLabel = document.getElementById("date-field-label");
  const calendar = document.getElementById("calendar");
  const calGrid = document.getElementById("cal-grid");
  const calMonthLabel = document.getElementById("cal-month-label");

  let viewYear, viewMonth, selectedDate = null;
  const todayDate = new Date();
  todayDate.setHours(0,0,0,0);
  viewYear = todayDate.getFullYear();
  viewMonth = todayDate.getMonth();

  function pad(n) { return n < 10 ? "0" + n : n; }
  function fmtDate(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
  function fmtDisplay(d) {
    const opts = { weekday: 'short', day: 'numeric', month: 'short' };
    return d.toLocaleDateString(undefined, opts);
  }

  function renderCalendar() {
    calMonthLabel.textContent = new Date(viewYear, viewMonth, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
    calGrid.innerHTML = "";
    ["S","M","T","W","T","F","S"].forEach(d => {
      const el = document.createElement("div");
      el.className = "dow";
      el.textContent = d;
      calGrid.appendChild(el);
    });
    const firstDay = new Date(viewYear, viewMonth, 1).getDay();
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();

    for (let i = firstDay - 1; i >= 0; i--) {
      const el = document.createElement("div");
      el.className = "cal-day other-month";
      el.textContent = daysInPrevMonth - i;
      calGrid.appendChild(el);
    }
    for (let d = 1; d <= daysInMonth; d++) {
      const el = document.createElement("div");
      el.className = "cal-day";
      el.textContent = d;
      const thisDate = new Date(viewYear, viewMonth, d);
      if (thisDate.getTime() === todayDate.getTime()) el.classList.add("today");
      if (selectedDate && thisDate.getTime() === selectedDate.getTime()) el.classList.add("selected");
      el.addEventListener("click", () => {
        selectedDate = thisDate;
        dateFieldLabel.textContent = fmtDisplay(thisDate);
        dateFieldLabel.classList.remove("dim");
        calendar.classList.remove("open");
        renderCalendar();
      });
      calGrid.appendChild(el);
    }
    const remaining = 42 - (firstDay + daysInMonth);
    for (let d = 1; d <= remaining; d++) {
      const el = document.createElement("div");
      el.className = "cal-day other-month";
      el.textContent = d;
      calGrid.appendChild(el);
    }
  }

  dateField.addEventListener("click", () => {
    calendar.classList.toggle("open");
  });
  document.getElementById("cal-prev").addEventListener("click", (e) => {
    e.stopPropagation();
    viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    renderCalendar();
  });
  document.getElementById("cal-next").addEventListener("click", (e) => {
    e.stopPropagation();
    viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    renderCalendar();
  });
  document.addEventListener("click", (e) => {
    if (!calendar.contains(e.target) && e.target !== dateField && !dateField.contains(e.target)) {
      calendar.classList.remove("open");
    }
  });
  renderCalendar();
  // default to today
  selectedDate = new Date(todayDate);
  dateFieldLabel.textContent = fmtDisplay(selectedDate);

  // ---------- Firebase ----------
  const firebaseConfig = {
    apiKey: "AIzaSyDUT9q0yKpseAtHeHWVoIR8uHvDv9dMJZA",
    authDomain: "reminder-bot-e0ab5.firebaseapp.com",
    databaseURL: "https://reminder-bot-e0ab5-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "reminder-bot-e0ab5",
    storageBucket: "reminder-bot-e0ab5.firebasestorage.app",
    messagingSenderId: "1052559567659",
    appId: "1:1052559567659:web:9d38eaaea4bc5f35dbb36e"
  };

  let db, notesRef, routineRef, firebaseReady = false;
  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    notesRef = db.ref("notes");
    routineRef = db.ref("routine");
    firebaseReady = true;
  } catch (err) {
    document.getElementById("add-status").textContent = "Can't connect to Firebase. Check internet/ad blocker.";
    document.getElementById("add-status").style.color = "var(--danger)";
  }

  // ---------- Add note ----------
  document.getElementById("add-btn").addEventListener("click", () => {
    const text = document.getElementById("text-input").value.trim();
    const statusEl = document.getElementById("add-status");

    if (!firebaseReady) { statusEl.textContent = "Not connected \u2014 can't save."; statusEl.style.color = "var(--danger)"; return; }
    if (!text) { statusEl.textContent = "Enter what it is first."; statusEl.style.color = "var(--danger)"; return; }
    if (!selectedDate) { statusEl.textContent = "Pick a due date."; statusEl.style.color = "var(--danger)"; return; }

    notesRef.push({
      text: text,
      dueDate: fmtDate(selectedDate),
      type: selectedType,
      createdAt: Date.now()
    }).then(() => {
      document.getElementById("text-input").value = "";
      statusEl.textContent = "Added.";
      statusEl.style.color = "var(--success)";
      setTimeout(() => statusEl.textContent = "", 1500);
    }).catch(() => {
      statusEl.textContent = "Couldn't save. Check connection.";
      statusEl.style.color = "var(--danger)";
    });
  });

  // ---------- Notes rendering ----------
  function daysBetween(dateStr) {
    const due = new Date(dateStr + "T00:00:00");
    const now = new Date(); now.setHours(0,0,0,0);
    return Math.round((due - now) / 86400000);
  }
  function bucketFor(daysAway) {
    if (daysAway < 0) return "Overdue";
    if (daysAway === 0) return "Today";
    if (daysAway === 1) return "Tomorrow";
    if (daysAway <= 7) return "This week";
    if (daysAway <= 31) return "This month";
    return "This year";
  }
  function countdownLabel(daysAway) {
    if (daysAway < 0) return `${Math.abs(daysAway)}d overdue`;
    if (daysAway === 0) return "Today";
    if (daysAway === 1) return "1 day left";
    return `${daysAway} days left`;
  }
  function buildItem(note, badgeText, urgent) {
    const div = document.createElement("div");
    div.className = "item " + note.type;
    const textEl = document.createElement("div");
    textEl.className = "item-text";
    textEl.textContent = note.text;
    const badge = document.createElement("div");
    badge.className = "item-badge " + (urgent ? "urgent" : "ok");
    badge.textContent = badgeText;
    const delBtn = document.createElement("button");
    delBtn.className = "del-btn";
    delBtn.textContent = "\u2715";
    delBtn.addEventListener("click", () => notesRef.child(note.id).remove());
    div.appendChild(textEl); div.appendChild(badge); div.appendChild(delBtn);
    return div;
  }
  function renderNotes(notes) {
    const deadlinesEl = document.getElementById("deadlines-section");
    const bucketsEl = document.getElementById("buckets-section");
    deadlinesEl.innerHTML = ""; bucketsEl.innerHTML = "";
    if (notes.length === 0) { bucketsEl.innerHTML = '<div class="empty">No notes yet.</div>'; return; }
    const deadlines = notes.filter(n => n.type === "deadline").sort((a,b) => daysBetween(a.dueDate) - daysBetween(b.dueDate));
    const reminders = notes.filter(n => n.type === "reminder");
    if (deadlines.length > 0) {
      const label = document.createElement("div"); label.className = "bucket-label"; label.textContent = "Deadlines";
      deadlinesEl.appendChild(label);
      deadlines.forEach(n => {
        const days = daysBetween(n.dueDate);
        deadlinesEl.appendChild(buildItem(n, countdownLabel(days), days <= 2));
      });
    }
    const order = ["Overdue","Today","Tomorrow","This week","This month","This year"];
    const grouped = {};
    reminders.forEach(n => { const b = bucketFor(daysBetween(n.dueDate)); (grouped[b] = grouped[b] || []).push(n); });
    order.forEach(bucket => {
      if (!grouped[bucket]) return;
      const label = document.createElement("div"); label.className = "bucket-label"; label.textContent = bucket;
      bucketsEl.appendChild(label);
      grouped[bucket].forEach(n => bucketsEl.appendChild(buildItem(n, bucket, false)));
    });
  }
  if (firebaseReady) {
    notesRef.on("value", snap => {
      const val = snap.val();
      const notes = [];
      if (val) Object.keys(val).forEach(k => notes.push({ id: k, ...val[k] }));
      renderNotes(notes);
    });
  }

  // ---------- Daily routine ----------
  const routineList = document.getElementById("routine-list");
  const todayKey = fmtDate(new Date());

  function getDoneSet() {
    const raw = localStorage.getItem("routine-done-" + todayKey);
    return raw ? new Set(JSON.parse(raw)) : new Set();
  }
  function saveDoneSet(set) {
    localStorage.setItem("routine-done-" + todayKey, JSON.stringify([...set]));
  }
  function renderRoutine(items) {
    routineList.innerHTML = "";
    const done = getDoneSet();
    if (items.length === 0) { routineList.innerHTML = '<div class="empty">No routine items yet.</div>'; return; }
    items.forEach(item => {
      const row = document.createElement("div");
      row.className = "routine-row";
      const check = document.createElement("div");
      check.className = "routine-check" + (done.has(item.id) ? " done" : "");
      check.textContent = done.has(item.id) ? "✓" : "";
      check.addEventListener("click", () => {
        const d = getDoneSet();
        if (d.has(item.id)) d.delete(item.id); else d.add(item.id);
        saveDoneSet(d);
        renderRoutine(items);
      });
      const text = document.createElement("div");
      text.className = "routine-text" + (done.has(item.id) ? " done" : "");
      text.textContent = item.text;
      const delBtn = document.createElement("button");
      delBtn.className = "del-btn";
      delBtn.textContent = "\u2715";
      delBtn.addEventListener("click", () => routineRef.child(item.id).remove());
      row.appendChild(check); row.appendChild(text); row.appendChild(delBtn);
      routineList.appendChild(row);
    });
  }
  if (firebaseReady) {
    routineRef.on("value", snap => {
      const val = snap.val();
      const items = [];
      if (val) Object.keys(val).forEach(k => items.push({ id: k, ...val[k] }));
      renderRoutine(items);
    });
  }
  document.getElementById("routine-add-btn").addEventListener("click", () => {
    const input = document.getElementById("routine-input");
    const text = input.value.trim();
    if (!text || !firebaseReady) return;
    routineRef.push({ text: text, createdAt: Date.now() });
    input.value = "";
  });

  // ---------- Timer ----------
  let timerSeconds = 300, timerInterval = null, timerRunning = false;
  const timerDisplay = document.getElementById("timer-display");
  function renderTimer() {
    const m = Math.floor(timerSeconds / 60), s = timerSeconds % 60;
    timerDisplay.textContent = `${pad(m)}:${pad(s)}`;
  }
  function beep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      osc.start();
      osc.stop(ctx.currentTime + 0.5);
    } catch(e) {}
  }
  function showAlert(title, message) {
    document.getElementById("alert-title").textContent = title;
    document.getElementById("alert-message").textContent = message;
    document.getElementById("alert-modal").classList.add("open");
    beep(); setTimeout(beep, 600); setTimeout(beep, 1200);
  }
  document.getElementById("alert-dismiss").addEventListener("click", () => {
    document.getElementById("alert-modal").classList.remove("open");
  });
  document.getElementById("timer-start").addEventListener("click", () => {
    if (timerRunning) return;
    if (timerSeconds <= 0) {
      timerSeconds = (parseInt(document.getElementById("timer-minutes").value)||0) * 60 + (parseInt(document.getElementById("timer-seconds").value)||0);
    }
    timerRunning = true;
    timerInterval = setInterval(() => {
      timerSeconds--;
      renderTimer();
      if (timerSeconds <= 0) {
        clearInterval(timerInterval); timerRunning = false;
        showAlert("⏰ Timer done", "Your countdown finished.");
      }
    }, 1000);
  });
  document.getElementById("timer-pause").addEventListener("click", () => {
    clearInterval(timerInterval); timerRunning = false;
  });
  document.getElementById("timer-reset").addEventListener("click", () => {
    clearInterval(timerInterval); timerRunning = false;
    timerSeconds = (parseInt(document.getElementById("timer-minutes").value)||0) * 60 + (parseInt(document.getElementById("timer-seconds").value)||0);
    renderTimer();
  });
  renderTimer();

  // ---------- Alarms ----------
  const alarmList = document.getElementById("alarm-list");
  function getAlarms() { return JSON.parse(localStorage.getItem("alarms") || "[]"); }
  function saveAlarms(a) { localStorage.setItem("alarms", JSON.stringify(a)); }
  function renderAlarms() {
    const alarms = getAlarms();
    alarmList.innerHTML = "";
    if (alarms.length === 0) { alarmList.innerHTML = '<div class="empty">No alarms set.</div>'; return; }
    alarms.forEach((a, i) => {
      const row = document.createElement("div");
      row.className = "alarm-row";
      const time = document.createElement("div");
      time.className = "alarm-time";
      time.textContent = a.time;
      const delBtn = document.createElement("button");
      delBtn.className = "del-btn";
      delBtn.textContent = "\u2715";
      delBtn.addEventListener("click", () => {
        const list = getAlarms(); list.splice(i, 1); saveAlarms(list); renderAlarms();
      });
      row.appendChild(time); row.appendChild(delBtn);
      alarmList.appendChild(row);
    });
  }
  document.getElementById("alarm-add-btn").addEventListener("click", () => {
    const input = document.getElementById("alarm-time-input");
    if (!input.value) return;
    const list = getAlarms();
    list.push({ time: input.value, firedToday: false });
    saveAlarms(list);
    input.value = "";
    renderAlarms();
  });
  renderAlarms();
  setInterval(() => {
    const now = new Date();
    const hh = pad(now.getHours()), mm = pad(now.getMinutes());
    const current = `${hh}:${mm}`;
    const list = getAlarms();
    let changed = false;
    list.forEach(a => {
      if (a.time === current && !a.firedToday) {
        showAlert("⏰ Alarm", "It's " + a.time);
        a.firedToday = true; changed = true;
      }
      if (a.time !== current && a.firedToday && current === "00:00") {
        a.firedToday = false; changed = true;
      }
    });
    if (changed) saveAlarms(list);
  }, 15000);
</script>
</body>
</html>
